<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop CreditTrack</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            max-width: 1000px; 
            margin: 0 auto; 
            padding: 10px; 
            background: #0f172a; /* Deep Midnight Navy */
            color: #f1f5f9;      /* Off-White Text */
        }
        h1 { font-size: 1.4rem; text-align: center; margin-bottom: 15px; color: #f1f5f9; }
        h2 { font-size: 1.1rem; margin-top: 0; color: #38bdf8; }
        
        .card { 
            background: #1e293b; /* Slate Dark Container */
            padding: 15px; 
            margin-bottom: 15px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
            width: 100%;
            overflow: hidden; 
        }
        
        input, button { 
            padding: 12px; 
            margin: 6px 0; 
            width: 100%; 
            font-size: 1rem;
            border: 1px solid #334155;
            border-radius: 4px; 
        }

        input {
            background: #0f172a;
            color: #f1f5f9;
        }

        input::placeholder {
            color: #64748b;
        }
        
        button { 
            background: #38bdf8; /* Electric Cyan */
            color: #0f172a;      /* Dark text for strong contrast */
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
        }
        button:hover { background: #0ea5e9; }
        
        .delete-btn { 
            background: #f87171; /* Crimson Red */
            color: #0f172a;
            width: auto; 
            padding: 6px 12px; 
            font-size: 0.9rem;
        }
        .delete-btn:hover { background: #ef4444; }
        
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 10px;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            min-width: 550px; 
        }
        
        th, td { 
            border: 1px solid #334155; 
            padding: 8px; 
            text-align: left; 
            font-size: 0.85rem;
            color: #f1f5f9;
        }
        
        th { background-color: #334155; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Shop Credit Ledger</h1>
        <p>Manage customer credits easily.</p>
        
        <!-- Example Form Input -->
        <input type="text" id="customerName" placeholder="Customer Name">
        <input type="number" id="creditAmount" placeholder="Amount">
        <button onclick="addCredit()">Add Credit Entry</button>
        
        <div id="response"></div>
    </div>

    <script>
        // Replace this URL with your actual live Render backend URL once ready!
        const API_URL = "https://shop-credit-backend.onrender.com";

        async function addCredit() {
            const name = document.getElementById('customerName').value;
            const amount = document.getElementById('creditAmount').value;

            try {
                // Change '/add-credit' to match whatever route path you defined in your FastAPI code!
                const response = await fetch(`${API_URL}/add-credit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ customer_name: name, amount: parseFloat(amount) })
                });
                
                const data = await response.json();
                document.getElementById('response').innerText = "Success: " + JSON.stringify(data);
            } catch (error) {
                document.getElementById('response').style.color = "red";
                document.getElementById('response').innerText = "Error connecting to backend!";
            }
        }
    </script>
</body>
</html>
