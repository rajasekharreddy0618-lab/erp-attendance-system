<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop CreditTrack</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            max-width: 1000px; 
            margin: 0 auto; 
            padding: 10px; 
            background: #0f172a; /* Deep Midnight Navy */
            color: #f1f5f9;      /* Off-White Text */
        }
        h1 { font-size: 1.4rem; text-align: center; margin-bottom: 15px; color: #f1f5f9; }
        h2 { font-size: 1.1rem; margin-top: 0; color: #38bdf8; }
        
        .card { 
            background: #1e293b; /* Slate Dark Container */
            padding: 15px; 
            margin-bottom: 15px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
            width: 100%;
            overflow: visible; 
        }
        
        input, button { 
            padding: 12px; 
            margin: 6px 0; 
            width: 100%; 
            font-size: 1rem;
            border: 1px solid #334155;
            border-radius: 4px; 
        }

        input {
            background: #0f172a;
            color: #f1f5f9;
        }

        input::placeholder {
            color: #64748b;
        }
        
        button { 
            background: #38bdf8; /* Electric Cyan */
            color: #0f172a;      /* Dark text for strong contrast */
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
        }
        button:hover { background: #0ea5e9; }
        
        .delete-btn { 
            background: #f87171; /* Crimson Red */
            color: #0f172a;
            width: auto; 
            padding: 6px 12px; 
            font-size: 0.9rem;
        }
        .delete-btn:hover { background: #ef4444; }
        
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 10px;
            display:block;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            min-width: 650px; 
        }
        
        th, td { 
            border: 1px solid #334155; 
            padding: 8px; 
            text-align: left; 
            font-size: 0.85rem;
            color: #f1f5f9;
            background:#1e2936;
        }
        
        th { background-color: #334155; }
    </style>
</head>
<body>

    <h1>🛒 Shop CreditTrack Dashboard</h1>

    <!-- Add Credit Form -->
    <div class="card">
        <h2>Add Credit Entry</h2>
        <input type="text" id="customerName" placeholder="Customer Name (e.g. Raju)">
        <input type="text" id="productName" placeholder="Product Name (e.g. Milk)">
        <input type="number" id="quantity" placeholder="Quantity(e.g 1)" min="1">
        <input type="number" id="unitPrice" placeholder="Unit Price (₹)" step="0.1">
        <button onclick="addCredit()">Save Credit</button>
        <p id="addResponse" style="font-weight: bold; margin-top: 10px;"></p>
    </div>

    <!-- View & Clear Credits -->
    <div class="card">
        <h2>All Active Credits</h2>
        <button onclick="fetchAllCredits()">🔄 Refresh List</button>
        <table id="creditTable">
            <thead>
                <tr>
                    <th>Customer</th>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Unit Price</th>
                    <th>Total Bill</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rows will be injected dynamically -->
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = "https://shop-credit-backend.onrender.com";

        async function addCredit() {
    const customer = document.getElementById("customerName").value.trim();
    const product = document.getElementById("productName").value.trim();
    const quantity = document.getElementById("quantity").value;
    const unitPrice = document.getElementById("unitPrice").value;
    const responseMessage = document.getElementById("addResponse");

    if (!customer || !product || !quantity || !unitPrice) {
        responseMessage.style.color = "#f87171";
        responseMessage.innerText = "Please fill in all fields!";
        return;
    }

    try {
        const response = await fetch(`${API_URL}/Calculate_Bill`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                Customer_Name: customer,
                Product_Name: product,
                Quantity: parseInt(quantity),
                Unit_Prize: parseFloat(unitPrice)
            })
        });

        if (response.ok) {
            responseMessage.style.color = "#38bdf8";
            responseMessage.innerText = "Credit recorded successfully!";
            
            // Clear input fields after saving
            document.getElementById("customerName").value = "";
            document.getElementById("productName").value = "";
            document.getElementById("quantity").value = "";
            document.getElementById("unitPrice").value = "";

            // 🚀 AUTOMATICALLY REFRESH THE TABLE TO SHOW THE NEW RECORD INSTANTLY
            fetchAllCredits();
        } else {
            responseMessage.style.color = "#f87171";
            responseMessage.innerText = "Failed to record credit. Try again.";
        }
    } catch (error) {
        console.error("Error:", error);
        responseMessage.style.color = "#f87171";
        responseMessage.innerText = "Connection error to backend!";
    }
}
        async function fetchAllCredits() {
            try {
                const response = await fetch(`${API_URL}/Get_all_credits`);
                const data = await response.json();
                const tbody = document.querySelector("#creditTable tbody");
                tbody.innerHTML = "";

                // Matches exact key name from your GET endpoint dictionary return
                const records = data["All crdeits"];

                if (records && records.length > 0) {
                    records.forEach(record => {
                        const row = document.createElement("tr");
                        row.innerHTML = `
                            <td>${record["Customer_Name"]}</td>
                            <td>${record["Product_Name"]}</td>
                            <td>${record["Quantity"]}</td>
                            <td>₹${record["Unit Prize"]}</td>
                            <td>₹${record["Total Bill"]}</td>
                            <td><button class="delete-btn" onclick="clearCustomer('${record["Customer_Name"]}')">Clear</button></td>
                        `;
                        tbody.appendChild(row);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No records found</td></tr>`;
                }
            } catch (error) {
                console.error("Failed to fetch records", error);
            }
        }

        async function clearCustomer(customerName) {
            if (!confirm(`Are you sure you want to clear all bills for ${customerName}?`)) return;

            try {
                const response = await fetch(`${API_URL}/Clear_Credit/${encodeURIComponent(customerName)}`, {
                    method: "DELETE"
                });
                const data = await response.json();
                alert(data.Message);
                fetchAllCredits();
            } catch (error) {
                alert("Failed to clear credit records.");
            }
        }

        // Automatically fetch records when the page loads
        window.onload = fetchAllCredits;
    </script>
</body>
</html>
